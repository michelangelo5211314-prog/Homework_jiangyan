<!doctype html>

<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>PIXEL STUDIO / 픽셀 메모</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" />
  <style>

    * { box-sizing: border-box; }

    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07140b; }

    body { color: #d9dfd2; font-family: "Press Start 2P", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }

    body > canvas { position: fixed; inset: 0; display: block; width:100vw; height:100vh; image-rendering:pixelated; image-rendering:crisp-edges; }

    #memo { display: none; position: fixed; z-index: 3; color: #e6e8d6; font: 8px/1.55 "Press Start 2P", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", monospace; }

    #memo.visible { display: block; }

    .screen-shell { position: absolute; inset: auto; top: 0; left: 0; width: calc(100% / var(--ui-scale,1)); height: calc(100% / var(--ui-scale,1)); transform: scale(var(--ui-scale,1)); transform-origin: top left; overflow: hidden; border: 2px solid #181613; background: #111911; box-shadow: inset 0 0 0 3px #71805c, 0 0 0 2px rgba(12,14,10,.5); image-rendering:pixelated; }

    .scroll-hint { position:fixed; inset:0; z-index:5; display:none; justify-content:center; align-items:center; overflow:hidden; background:rgba(7,19,12,.78); color:#b7e99f; text-align:center; pointer-events:none; }

    body.far-view .scroll-hint { display:flex; }

    .scroll-hint-text { display:block; min-height:2.8em; padding-right:4px; border-right:2px solid transparent; color:#b7e99f; white-space:pre-line; font:500 clamp(14px,2.2vw,22px)/1.8 "Orbitron","Arial",sans-serif; letter-spacing:.08em; text-shadow:0 0 8px rgba(183,233,159,.5),0 0 18px rgba(168,215,201,.24); }

    .scroll-hint.typing .scroll-hint-text { border-right-color:#b7e99f; animation:blink-caret .7s steps(2,end) infinite; }

    @keyframes blink-caret { 50% { border-color:transparent; } }

    .desktop-page, .app-window { position: absolute; inset: 0; overflow: hidden; }

    .desktop-page { background:#030504; }

    .desktop-page::before { content:""; position:absolute; inset:0; opacity:.08; background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(145,208,176,.2) 4px,transparent 5px); pointer-events:none; }

    .desktop-icons { position:relative; z-index:1; display:flex; gap:9px; align-items:flex-start; padding:10px; }

    .app-icon { width:34px; height:37px; padding:0; border:0; background:transparent; color:#e3e8ce; display:grid; justify-items:center; align-content:start; cursor:pointer; }

    .app-icon:hover .app-glyph,.app-icon:focus-visible .app-glyph { transform:translateY(-3px) scale(1.05); filter:drop-shadow(0 0 8px rgba(199,222,156,.55)); }

    .app-icon:focus-visible { outline:1px dashed #dce7bd; outline-offset:2px; }

    .app-glyph { width:27px; height:27px; display:grid; place-items:center; border:0; border-radius:0; background:transparent; box-shadow:2px 2px 0 rgba(0,0,0,.7); transition:transform .18s,filter .18s; image-rendering:pixelated; }

    .app-glyph svg { width:27px; height:27px; display:block; overflow:visible; image-rendering:pixelated; shape-rendering:crispEdges; }

    .app-window { inset:8% 7% 10%; display:none; z-index:3; padding:0; background:#101610; border:3px solid #a8d7c9; border-radius:0; box-shadow:4px 4px 0 #050806,0 10px 28px rgba(0,0,0,.42); image-rendering:pixelated; }

    .app-window.open { display:block; }

    .app-topbar { height:27px; display:flex; align-items:center; justify-content:space-between; gap:5px; padding:2px 4px; border-bottom:3px solid #a8d7c9; background:#17271f; color:#a8d7c9; font-size:7px; }

    .app-topbar button,.pixel-button { border:2px solid #a8d7c9; border-radius:0; background:#101610; color:#a8d7c9; padding:5px 7px; font:6px/1.4 "Press Start 2P",monospace; cursor:pointer; box-shadow:2px 2px 0 #050806; }

    .app-topbar button { padding:2px 5px; color:#a8d7c9; }

    .window-title { height:23px; display:flex; align-items:center; justify-content:space-between; padding:0 6px; background:#a8d7c9; color:#07100d; font-size:6px; }

    .window-controls { letter-spacing:2px; font:9px/1 monospace; }

    .app-topbar button:hover,.pixel-button:hover { color:#101610; background:#a8d7c9; text-shadow:none; }

    .calendar-view { height:calc(100% - 50px); padding:7px 6px 5px; background:#0b100d; }

    .weekdays,.calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; }

    .weekdays { margin-bottom:4px; color:#a8d7c9; text-align:center; font-size:5px; }

    .calendar-grid { grid-auto-rows:minmax(18px,1fr); height:calc(100% - 12px); }

    .date-cell { position:relative; min-width:0; width:auto; height:100%; aspect-ratio:1; justify-self:center; padding:0; border:0; background:transparent; color:#c4e1d4; font:7px "Press Start 2P",monospace; cursor:pointer; perspective:420px; }

    .date-cell:focus-visible { outline:2px dashed #fff0cf; outline-offset:2px; }

    .date-card-inner { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .48s cubic-bezier(.2,.75,.25,1); }

    .date-cell:hover .date-card-inner,.date-cell:focus-visible .date-card-inner { transform:rotateY(180deg); }

    .date-face { position:absolute; inset:0; display:grid; place-items:center; border:2px solid #6d9f90; background:#14221b; color:#c4e1d4; backface-visibility:hidden; box-shadow:2px 2px 0 #030705; text-shadow:2px 2px #07130c; }

    .date-face-back { transform:rotateY(180deg); border-color:#8bb6a5; color:#a8d7c9; grid-template-rows:1fr auto 1fr; font-size:6px; }

    .date-back-number { align-self:end; }

    .date-back-label { align-self:start; font:4px/1.4 "Orbitron","Arial",sans-serif; letter-spacing:.08em; }

    .date-cell.today .date-face { color:#9ed9e8; border-color:#75bccc; text-shadow:2px 2px #18333a; }

    .date-cell.today .date-face-back { color:#a8d7e8; }

    .date-cell.empty { background:transparent; cursor:default; }

    .date-cell.has-note .date-face { border-color:#f0bd6c; box-shadow:inset 0 0 0 1px rgba(255,226,160,.72),0 0 0 1px rgba(240,189,108,.72),0 0 9px 2px rgba(240,189,108,.62),2px 2px 0 #030705; }

    @media(prefers-reduced-motion:reduce) {

      .date-card-inner { transition:none; }

    }

    .archive-list { height:calc(100% - 30px); overflow:auto; padding:4px; }

    .archive-item { width:100%; margin:4px 0; padding:7px; text-align:left; border:0; border-bottom:1px solid rgba(207,220,177,.24); background:transparent; color:#e0e5cf; font:6px/1.6 "Press Start 2P",monospace; cursor:pointer; }

    .archive-item:hover { color:#efbd79; background:rgba(255,255,255,.05); }

    .day-view { position:absolute; inset:0; display:none; z-index:4; padding:0; perspective:900px; background:#020403; }

    .day-view.open { display:grid; place-items:center; }

    .day-card { width:100%; height:100%; padding:10px 12px; display:flex; flex-direction:column; gap:7px; border:0; border-radius:0; background:#020403; color:#b7e99f; box-shadow:inset 0 0 0 2px #1d3825; transform-origin:center; animation:flip-card .52s steps(6,end) both; }

    @keyframes flip-card { from { opacity:0; transform:rotateX(-78deg) translateY(-18px) scale(.92); } to { opacity:1; transform:rotateX(0) translateY(0) scale(1); } }

    .day-card-head { display:flex; align-items:center; justify-content:space-between; padding:3px 2px 8px; border-bottom:1px solid #31563b; color:#85b77b; font-size:6px; }

    .day-toolbar { display:flex; align-items:center; gap:6px; }

    .day-toolbar button { display:grid; place-items:center; width:27px; height:25px; padding:0; border:1px solid #659267; background:#101610; color:#c6edaa; font:14px/1 "Press Start 2P",monospace; cursor:pointer; box-shadow:2px 2px 0 #071109; }

    .day-toolbar button:hover { color:#101610; background:#a8d7c9; }

    .day-toolbar #saveDay { color:#efffc8; border-color:#a6d486; background:#23442b; font-size:17px; }

    .day-toolbar #saveDay:hover { background:#a8d7c9; color:#101610; box-shadow:0 0 10px rgba(168,215,201,.55); }

    .day-number { font:16px/1.4 "Press Start 2P",monospace; color:#bde998; }

    .day-prompt { font-size:6px; line-height:1.8; color:#6f9a70; }

    #dayCanvas { flex:1; min-height:55px; width:100%; display:block; background:#020403; border:1px dashed #28462e; touch-action:none; cursor:crosshair; image-rendering:pixelated; }

    #dayStatus { min-height:10px; color:#9ed58c; font-size:6px; }

    .pixel-button { color:#c6edaa; border:1px solid #659267; background:#19371f; padding:8px 12px; box-shadow:2px 2px 0 #071109; }

    .archive-thumb { width:50px; height:32px; margin:0 6px 0 0; vertical-align:middle; object-fit:contain; background:#020403; border:1px solid #658a63; image-rendering:pixelated; }

    #cursorSpark { position:fixed; z-index:9; inset:0; overflow:hidden; pointer-events:none; }

    .spark { position:absolute; width:4px; height:4px; background:#dcffad; box-shadow:0 0 7px 2px rgba(198,255,150,.7); image-rendering:pixelated; animation:spark-out .48s steps(4,end) forwards; }

    @keyframes spark-out { to { opacity:0; transform:translate(var(--dx),var(--dy)) scale(.25); } }

    #memo button:focus-visible { outline:2px dashed #fff0cf; outline-offset:2px; }

    @media(max-width:600px) {

      .desktop-icons { gap:7px; padding:10px 8px; }

      .app-icon { width:30px; height:34px; }

      .calendar-grid { gap:2px; }

      .date-cell { font-size:6px; }

      .day-card { padding:7px; gap:5px; }

    }

  
/* Oversized floating pixel Rolodex */
#rolodexOverlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(1,8,5,.75);backdrop-filter:blur(3px);font-family:"Courier New",monospace;color:#c6e6cf}
#rolodexOverlay.open{display:flex}
.rolodex{position:relative;width:min(880px,94vw);height:min(760px,92vh);display:flex;flex-direction:column;filter:drop-shadow(12px 15px 0 #020805)}
.rolo-bar{flex:none;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border:3px solid #b4ddc7;background:#12251a;font:700 13px monospace;letter-spacing:2px}
.rolo-bar button,.rolo-actions button,.rolo-nav button{cursor:pointer;background:#172d20;color:#d9f2db;border:2px solid #91bba4;padding:7px 12px;font:700 12px monospace;box-shadow:3px 3px 0 #030a06}
.rolo-bar button:hover,.rolo-actions button:hover,.rolo-nav button:hover{background:#9bc9aa;color:#09170e}
.rolo-tabs{flex:none;height:112px;position:relative;margin:16px 35px -2px;overflow:hidden}
.rolo-tab{position:absolute;left:var(--x);top:var(--y);height:46px;width:29%;border:3px solid #0a1a11;background:#a9c7b2;color:#102318;clip-path:polygon(0 0,68% 0,77% 20%,100% 20%,100% 100%,0 100%);text-align:left;padding:8px 12px;cursor:pointer;font:700 12px monospace;white-space:nowrap;box-shadow:3px 3px #08160e}
.rolo-tab.active{background:#e0e7ce;color:#08170e}
.rolo-sheet{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;border:4px solid #0b1a10;background:#dce4d1;color:#142519;padding:22px 30px;box-shadow:inset 0 0 0 4px #9ab7a1}
.rolo-sheet:before{content:"";pointer-events:none;position:absolute;inset:12px;border:1px dashed #7c9c85}
.rolo-head{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:3px solid #15271b;padding-bottom:12px}
.rolo-head strong{font:700 clamp(18px,3vw,30px) monospace;letter-spacing:3px}
.rolo-head small{font:11px monospace}
.rolo-meta{position:relative;display:flex;gap:10px;align-items:center;margin:16px 0 8px;font:700 11px monospace}
.rolo-meta input{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px solid #678773;padding:7px;color:#13261a;font:700 17px monospace;outline:none}
#roloText{position:relative;flex:1;min-height:0;width:100%;resize:none;background:repeating-linear-gradient(transparent 0,transparent 29px,#b8c9b8 30px);background-size:100% 30px;border:0;outline:0;color:#14291b;font:17px/30px monospace;padding:4px 0}
.rolo-actions{position:relative;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.rolo-actions button{font-size:11px}.rolo-actions span{margin-left:auto;font:11px monospace}
.rolo-base{height:56px;flex:none;margin:0 8px;background:#2b4733;border:4px solid #a4c8af;clip-path:polygon(0 0,100% 0,96% 100%,4% 100%);display:flex;align-items:center;justify-content:center}
.rolo-nav{display:flex;gap:16px}.rolo-nav button{padding:5px 22px}
@media(max-width:600px){.rolodex{height:92vh}.rolo-tabs{margin:8px 10px -2px;height:100px}.rolo-tab{width:38%;font-size:10px}.rolo-sheet{padding:18px 17px}.rolo-head small{display:none}.rolo-meta input{font-size:13px}#roloText{font-size:14px}}


/* Inverted monochrome pixel stationery: white card / black electronic text */
#rolodexOverlay{background:rgba(0,0,0,.78);color:#111;backdrop-filter:blur(2px)}
.rolodex{filter:drop-shadow(12px 14px 0 #000)}
.rolo-bar{background:#f8f8f3;color:#050505;border:3px solid #050505;box-shadow:inset 0 0 0 3px #fff;font-family:"Courier New",monospace}
.rolo-bar button,.rolo-actions button,.rolo-nav button{background:#fff;color:#050505;border:2px solid #050505;box-shadow:3px 3px 0 #050505;border-radius:0;font-family:"Courier New",monospace}
.rolo-bar button:hover,.rolo-actions button:hover,.rolo-nav button:hover{background:#050505;color:#fff}
.rolo-tabs{height:122px;margin-bottom:-3px}
.rolo-tab{background:#f5f5f0;color:#050505;border:3px solid #050505;box-shadow:4px 4px 0 #050505;font-family:"Courier New",monospace;letter-spacing:1px}
.rolo-tab.active{background:#050505;color:#fff;border-color:#050505}
.rolo-sheet{background:#fff;color:#050505;border:4px solid #050505;box-shadow:inset 0 0 0 4px #fff}
.rolo-sheet:before{border:1px dashed #999}
.rolo-head{border-bottom:3px solid #050505}
.rolo-head strong{font-family:"Courier New",monospace}
.rolo-meta{color:#111}
.rolo-meta input{color:#050505;border-bottom:2px solid #050505}
#roloText{color:#050505;background:repeating-linear-gradient(transparent 0,transparent 29px,#ddd 30px);background-size:100% 30px;caret-color:#000}
.rolo-base{background:#f6f6f1;border:4px solid #050505}
#roloStatus{color:#111}
.rolo-bar,.rolo-tab,.rolo-sheet,.rolo-base,.rolo-actions button{image-rendering:pixelated}


/* Korean pixel lettering + mechanical flip card */

#rolodexOverlay, #rolodexOverlay button, #rolodexOverlay input, #rolodexOverlay textarea, #rolodexOverlay strong, #rolodexOverlay small, #rolodexOverlay label, #rolodexOverlay span{font-family:"Press Start 2P","Galmuri11","Galmuri9",monospace!important;}
#rolodexOverlay button{font-size:10px;line-height:1.6;}
#roloText{font-size:15px;line-height:30px;}
.rolo-sheet{transform-style:preserve-3d;transform-origin:50% 100%;backface-visibility:hidden;}
.rolo-sheet.flip-next{animation:roloFlipNext .52s steps(9,end) both;}
.rolo-sheet.flip-prev{animation:roloFlipPrev .52s steps(9,end) both;}
@keyframes roloFlipNext{0%{transform:perspective(950px) rotateX(0deg) translateY(0);opacity:1}45%{transform:perspective(950px) rotateX(-42deg) translateY(15px);opacity:.5}55%{transform:perspective(950px) rotateX(24deg) translateY(-10px);opacity:.6}100%{transform:perspective(950px) rotateX(0deg);opacity:1}}
@keyframes roloFlipPrev{0%{transform:perspective(950px) rotateX(0deg);opacity:1}45%{transform:perspective(950px) rotateX(34deg) translateY(-10px);opacity:.5}55%{transform:perspective(950px) rotateX(-20deg) translateY(10px);opacity:.6}100%{transform:perspective(950px) rotateX(0deg);opacity:1}}
@media(prefers-reduced-motion:reduce){.rolo-sheet.flip-next,.rolo-sheet.flip-prev{animation:none}}

/* Shared English / Korean pixel typography. No placeholder text in editors. */
#rolodexOverlay, #rolodexOverlay button, #rolodexOverlay input, #rolodexOverlay textarea, #rolodexOverlay strong, #rolodexOverlay small, #rolodexOverlay label, #rolodexOverlay span {font-family:"Press Start 2P","Galmuri11",monospace!important;}
#rolodexOverlay button {font-size:9px;line-height:1.7;}
#roloText {font-size:15px;line-height:30px;}
#roloTitle {font-size:13px;}
#roloText::placeholder,#roloTitle::placeholder{color:transparent;}
#rolodexOverlay .rolo-sheet{transform-style:preserve-3d;transform-origin:50% 100%;}
#rolodexOverlay .rolo-sheet.flip-next{animation:roloFlipNext .52s steps(9,end) both;}
#rolodexOverlay .rolo-sheet.flip-prev{animation:roloFlipPrev .52s steps(9,end) both;}
#pixelFx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#pixelFx canvas{display:block;position:absolute;inset:0;pointer-events:none;image-rendering:pixelated}
@media(prefers-reduced-motion:reduce){#rolodexOverlay .rolo-sheet.flip-next,#rolodexOverlay .rolo-sheet.flip-prev{animation:none}}

/* Static green pixel puppy: instant show / hide, no animations. */
#pixelDog{position:fixed;left:50%;top:50%;width:min(265px,36vw);aspect-ratio:1;z-index:50;pointer-events:none;display:none;transform:translate(-50%,-50%);image-rendering:pixelated}
#pixelDog.show{display:block}
#pixelDog svg{width:100%;height:100%;image-rendering:pixelated;shape-rendering:crispEdges}
/* Fallback desktop activates if remote 3D library is unavailable. */
#offlineDesktop{display:none;position:fixed;inset:0;background:#07140b;color:#b7e99f;padding:clamp(20px,6vw,65px);z-index:3;font-family:"Press Start 2P","Galmuri11",monospace}
body.fallback-mode #offlineDesktop{display:block}
.offline-screen{max-width:850px;margin:8vh auto;padding:26px;border:4px solid #a8d7c9;background:#0e1c14;box-shadow:8px 8px 0 #010604}
.offline-screen h1{font-size:clamp(12px,2vw,21px);line-height:2}
.offline-screen p{font-size:11px;line-height:2.2}
.offline-screen button{font:12px "Press Start 2P","Galmuri11",monospace;border:3px solid #a8d7c9;background:#152e1d;color:#e4f3d7;box-shadow:4px 4px 0 #000;padding:18px;margin-top:12px;cursor:pointer}

/* Fully functional local fallback room: only HTML/CSS, no CDNs required. */
#offlineDesktop {padding:0!important;background:#07140b!important;overflow:hidden;}
#offlineDesktop .offline-screen{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);margin:0;width:min(820px,94vw);max-width:none;padding:0;background:transparent;border:0;box-shadow:none;text-align:center}
.offline-screen .room {height:min(66vh,530px);min-height:320px;background:#152a1c;border:10px solid #0b1a11;position:relative;overflow:hidden;box-shadow:0 0 0 5px #314632,0 0 0 12px #07130b,12px 17px 0 #000;}
.offline-screen .room:before {content:'';position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(0deg,#3a3829 0 11px,#25271d 11px 15px)}
.offline-screen .wall-shelf {position:absolute;top:13%;left:8%;width:25%;height:8px;background:#7a653f;box-shadow:0 -30px 0 -12px #899373,0 9px 0 #251c14}
.offline-screen .wall-shelf:nth-child(2){left:67%;top:20%;width:24%}
.offline-screen .desk {position:absolute;bottom:11%;left:4%;width:92%;height:25%;background:#564a31;border-top:16px solid #927b50;box-shadow:0 10px 0 #2b261e;}
.offline-screen .computer {position:absolute;bottom:27%;left:50%;transform:translateX(-50%);width:44%;height:49%;background:#b9b39a;border:11px solid #928d75;box-shadow:10px 8px 0 #0b180e;}
.offline-screen .computer:after {content:'';position:absolute;bottom:-35px;left:37%;width:26%;height:25px;background:#a7a08b;box-shadow:0 7px 0 6px #89816b}
.offline-screen .crt {height:78%;border:7px solid #2a3828;background:#06130b;color:#b7e99f;padding:12px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-shadow:0 0 5px #90bd83;font-size:clamp(8px,1.2vw,12px);line-height:2}
.offline-screen .crt small{font-size:clamp(6px,1vw,9px);color:#8bb997}
.offline-screen .crt button {margin:0;background:#203a28;color:#e3ffe0;font-size:clamp(7px,.9vw,10px);padding:12px 10px}
.offline-screen .keyboard {position:absolute;bottom:21%;left:33%;width:34%;height:4%;background:repeating-linear-gradient(90deg,#c1baa0 0 9px,#555745 9px 11px);transform:perspective(100px) rotateX(28deg);border:4px solid #aca58b}
.offline-screen .room-title {position:absolute;top:4%;left:4%;font-size:10px;color:#bdcbb3;line-height:2}
#offlineDesktop .offline-tip {font-size:9px;line-height:2.4;margin-top:38px;color:#b7e99f}
@media(max-width:600px){.offline-screen .computer{width:60%}.offline-screen .keyboard{left:25%;width:50%}.offline-screen .room{min-height:300px}.offline-screen .crt{padding:4px 0}}

/* Still pixel puppy artwork, not animated. */
#pixelDog {width:clamp(64px,8vw,96px);height:auto;aspect-ratio:1;filter:drop-shadow(3px 3px 0 #08160c)}
#pixelDog img{width:100%;height:100%;object-fit:contain;display:block;image-rendering:pixelated}
/* Real perspective-rendered offline studio replaces the old flat fallback */
body.fallback-mode #offlineDesktop {background:#07140b!important;}
body.fallback-mode #offlineDesktop .offline-screen{width:100%;height:100%;max-width:none;top:0;left:0;transform:none;}
body.fallback-mode #offlineDesktop .offline-screen .room,body.fallback-mode #offlineDesktop .offline-tip{display:none;}
#offline3dCanvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;cursor:pointer;}
#offline3dHelp{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);pointer-events:none;color:#b7e99f;font:9px/1.9 'Press Start 2P',monospace;text-align:center;text-shadow:2px 2px #000;white-space:pre-line;}
#offlineDesktop button#offlineMemo{position:fixed;z-index:6;left:50%;top:51%;transform:translate(-50%,-50%);background:#172c1e;color:#cbefb7;border:2px solid #a8d7c9;padding:12px 18px;font:10px 'Press Start 2P',monospace;box-shadow:3px 3px #030704;cursor:pointer;}
body:not(.fallback-mode) #offline3dCanvas,body:not(.fallback-mode) #offline3dHelp{display:none;}

/* iPad-first controls: retain original CRT/Three.js model */
#enterStudio {position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:9;border:3px solid #a8d7c9;background:#152e1d;color:#e4f3d7;padding:14px 18px;box-shadow:4px 4px #010705;font:10px 'Press Start 2P','Galmuri11',monospace;cursor:pointer;touch-action:manipulation;}
#enterStudio.hidden{display:none}
#rolodexOverlay button, #rolodexOverlay input, #rolodexOverlay textarea {touch-action:manipulation}
#rolodexOverlay textarea{touch-action:pan-y}
#memoLibrary[hidden]{display:none!important}
#memoLibrary{position:absolute;z-index:70;inset:5% max(3%,calc((100% - 700px)/2));overflow:auto;background:#f4f5ee;color:#09120d;border:4px solid #0d1c11;box-shadow:10px 10px 0 #000;padding:18px;min-width:0;font:12px/1.8 'Press Start 2P','Galmuri11',monospace}
#memoLibrary header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid #182c1e;padding-bottom:14px}
#memoLibrary button{border:2px solid #182c1e;background:#fff;color:#182c1e;padding:10px;box-shadow:2px 2px #17271d;font:10px/1.7 'Press Start 2P','Galmuri11',monospace;cursor:pointer}
.library-tools{display:flex;gap:10px;flex-wrap:wrap;margin:17px 0}
#memoList{display:grid;gap:9px}
#memoList .saved-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px;background:#e3e8db;border:2px solid #203b2c;color:#13251a}
#memoList .saved-row button{flex:1;text-align:left;background:transparent;border:none;box-shadow:none;overflow-wrap:anywhere}
#memoLibrary small{display:block;margin-top:16px;color:#385843}
@media(pointer:coarse){#rolodexOverlay button{min-height:43px}#roloText,#roloTitle{font-size:16px!important}.rolo-actions{gap:6px}.rolo-bar{padding:8px 10px}.rolodex{height:min(820px,94dvh);width:min(900px,96vw)}.rolo-sheet{padding:15px 17px}}
@media(max-width:650px){.rolo-actions button{font-size:8px!important;padding:7px 6px}.rolo-nav button{font-size:8px!important;padding:8px}.rolo-head small{display:none}#memoLibrary{inset:3% 3%;padding:12px}.rolo-tabs{margin:10px 12px -3px;height:92px}}

/* iPad touch support: never hide the real 3D room behind a start screen */
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%;}
body>canvas{touch-action:none;}
#rolodexOverlay{overscroll-behavior:contain;}
#roloText{touch-action:pan-y;-webkit-overflow-scrolling:touch;}
#roloTabs{touch-action:pan-x;}
#engineError{white-space:pre-line;position:fixed;z-index:80;top:8px;left:8px;max-width:calc(100vw - 16px);padding:8px 10px;background:#0e2517;color:#b7e99f;border:2px solid #a8d7c9;font:11px/1.6 monospace;pointer-events:none}
#engineError[hidden]{display:none}
@media(pointer:coarse){.app-icon{min-width:40px;min-height:44px}.rolo-actions button,.rolo-nav button{min-height:42px} }

/* Memo mascot: fixed inside the folder, always visible when folder is open. */
.rolo-sheet #pixelDog {
  position: absolute;
  left: auto;
  top: auto;
  right: 12px;
  bottom: 72px;
  width: clamp(155px, 19vw, 215px);
  height: auto;
  aspect-ratio: 1;
  display: block;
  transform: none;
  z-index: 6;
  pointer-events: none;
  filter: drop-shadow(4px 4px 0 #17271b);
}
.rolo-sheet #roloText {padding-right: clamp(155px, 20vw, 220px);}
@media (max-width: 600px) {
 .rolo-sheet #pixelDog {right: 5px;bottom: 82px;width: 116px;}
 .rolo-sheet #roloText {padding-right: 112px;}
}

#enterStudio{display:none!important}

/* Safari iPad: the 3D surface is gesture-controlled, not the browser viewport. */
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;}
body>canvas,#memo,#memo .screen-shell{touch-action:none;-webkit-user-select:none;user-select:none;}
#memo button,#memo input,#memo textarea,#dayCanvas{ -webkit-user-select:auto;user-select:auto; }
#rolodexOverlay,#memoLibrary{touch-action:pan-y;}

<script>
// Keep the genuine Three.js workshop visible; no substitute page / ENTER button.
(function () {
  const notice = document.getElementById('engineError');
  function status(message) { notice.hidden = false; notice.textContent = message; }
  function ready() { notice.hidden = true; }
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') return;
    status('JavaScript 오류: ' + (e.message || 'unknown'));
  }, true);
  window.addEventListener('unhandledrejection', function(e) {
    status('JavaScript 오류: ' + String(e.reason || 'unknown'));
  });
  if (!document.createElement('canvas').getContext('webgl')) {
    status('Safari WebGL을 사용할 수 없습니다.'); return;
  }
  const threeSources = [
    './vendor/three.min.js', // Optional: local copy for offline / restricted networks
    'https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.150.1/three.min.js',
    'https://unpkg.com/three@0.150.1/build/three.min.js'
  ];
  function loadScript(url, timeoutMs) {
    return new Promise(function(resolve, reject) {
      const tag=document.createElement('script');
      let done=false;
      const timer=setTimeout(function(){finish(false);}, timeoutMs);
      function finish(ok){if(done)return;done=true;clearTimeout(timer);if(!ok)tag.remove();ok?resolve():reject(new Error(url));}
      tag.onload=function(){finish(true)};
      tag.onerror=function(){finish(false)};
      tag.src=url;
      document.body.append(tag);
    });
  }
  function initializeWorkshop() {
if (typeof THREE === 'undefined') {
  // No dependencies required. Memo always works even when CDNs are blocked.
  document.body.classList.add('fallback-mode');
  const root=document.getElementById('rolodexOverlay'),tabs=document.getElementById('roloTabs');
  const title=document.getElementById('roloTitle'),body=document.getElementById('roloText'),status=document.getElementById('roloStatus');
  const key='night-studio-rolodex-v1';
  let cards=[];let at=0;let locked=false;
  try {const old=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(old))cards=old.filter(x=>x&&typeof x==='object');}catch(e){}
  if(!cards.length)cards=[{title:'',text:''}];
  function persist(){try{localStorage.setItem(key,JSON.stringify(cards));status.textContent='SAVED / 저장됨';}catch(e){status.textContent='ERROR / 저장 실패';}}
  function commit(){cards[at]={title:title.value,text:body.value};persist();}
  function render(){let c=cards[at];title.value=c.title||'';body.value=c.text||'';
    document.querySelector('.rolo-head strong').textContent='INDEX / '+String(at+1).padStart(3,'0');tabs.replaceChildren();
    let start=Math.max(0,Math.min(at-2,cards.length-5));
    cards.slice(start,start+5).forEach((card,i)=>{let index=i+start,btn=document.createElement('button');btn.className='rolo-tab'+(index===at?' active':'');btn.style.setProperty('--x',(i%3)*33+'%');btn.style.setProperty('--y',Math.floor(i/3)*50+'px');btn.textContent=(card.title||'UNTITLED / 제목 없음').slice(0,17);btn.onclick=()=>go(index);tabs.append(btn);});
    status.textContent=(at+1)+' / '+cards.length;
  }
  function go(n){if(locked||cards.length<2)return;commit();let prev=at;at=(n+cards.length)%cards.length;if(prev===at)return;
    render();let s=document.querySelector('.rolo-sheet');s.classList.remove('flip-next','flip-prev');void s.offsetWidth;
    s.classList.add(n>prev?'flip-next':'flip-prev');locked=true;setTimeout(()=>{s.classList.remove('flip-next','flip-prev');locked=false;},550);
  }
  function open(){root.classList.add('open');root.setAttribute('aria-hidden','false');render();}
  function close(){commit();root.classList.remove('open');root.setAttribute('aria-hidden','true');}
  document.getElementById('offlineMemo').onclick=open;
  document.getElementById('roloClose').onclick=close;
  document.getElementById('roloPrev').onclick=()=>go(at-1);
  document.getElementById('roloNext').onclick=()=>go(at+1);
  document.getElementById('roloSave').onclick=()=>{commit();render();};
  document.getElementById('roloNew').onclick=()=>{commit();cards.push({title:'',text:''});at=cards.length-1;persist();render();title.focus();};
  document.getElementById('roloDelete').onclick=()=>{if(!confirm('DELETE MEMO? / 메모를 삭제할까요?'))return;cards.splice(at,1);if(!cards.length)cards=[{title:'',text:''}];at=Math.min(at,cards.length-1);persist();render();};
  root.addEventListener('wheel',e=>{if(e.target.closest('textarea,input'))return;e.preventDefault();if(!locked)go(at+(e.deltaY>0?1:-1));},{passive:false});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&root.classList.contains('open'))close();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&root.classList.contains('open')){e.preventDefault();commit();}});

  // iPad and offline browser support: swipe category tabs, saved cards, backup transfer.
  document.getElementById('enterStudio')?.classList.add('hidden');
  let touchPoint=null;
  tabs.addEventListener('touchstart',e=>{if(e.touches.length===1)touchPoint={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
  tabs.addEventListener('touchend',e=>{if(!touchPoint||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touchPoint.x,dy=e.changedTouches[0].clientY-touchPoint.y;touchPoint=null;if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy))go(at+(dx<0?1:-1));},{passive:true});

    const inner=document.createElement('span'); inner.className='date-card-inner';

    const front=document.createElement('span'); front.className='date-face date-face-front'; front.textContent=day;

    const back=document.createElement('span'); back.className='date-face date-face-back';

    const backNumber=document.createElement('span'); backNumber.className='date-back-number'; backNumber.textContent=day;

    const backLabel=document.createElement('span'); backLabel.className='date-back-label'; backLabel.textContent=entries[dateKey]?'NOTE':'OPEN';

    back.append(backNumber,backLabel); inner.append(front,back); cell.append(inner);

    cell.setAttribute('aria-label',`${dateKey} 메모 열기`);

    if(entries[dateKey])cell.classList.add('has-note');

    if(dateKey===todayKey())cell.classList.add('today');

    cell.addEventListener('click',()=>openDay(dateKey));

    grid.append(cell);

  }

}

function openDay(dateKey) {

  selectedDate=dateKey;

  const date=new Date(`${dateKey}T12:00:00`);

  document.getElementById('dayNumber').textContent=String(date.getDate()).padStart(2,'0');

  document.getElementById('dayPrompt').textContent=`${date.getFullYear()} / ${String(date.getMonth()+1).padStart(2,'0')}`;

  clearDayCanvas();

  const saved=entries[dateKey];

  if(typeof saved==='string'&&saved.startsWith('data:image/')){

    const img=new Image(); img.onload=()=>{pen.drawImage(img,0,0,dayCanvas.width,dayCanvas.height);}; img.src=saved; hasInk=true;

  }

  document.getElementById('dayStatus').textContent=saved?'저장됨 · 계속 그릴 수 있습니다':'그린 후 + 버튼으로 저장';

  dayView.classList.add('open');

  const card=document.getElementById('dayCard'); card.style.animation='none'; void card.offsetWidth; card.style.animation='';

}

function closeDay() { dayView.classList.remove('open'); }

function saveDay() {

  if(!hasInk){document.getElementById('dayStatus').textContent='먼저 내용을 작성하세요';return;}

  const previous=entries[selectedDate];

  entries[selectedDate]=dayCanvas.toDataURL('image/png');

  try {

    localStorage.setItem(notesKey,JSON.stringify(entries));

  } catch(error) {

    if(previous===undefined)delete entries[selectedDate];

    else entries[selectedDate]=previous;

    document.getElementById('dayStatus').textContent=`저장 실패: ${error.message}`;

    return;

  }

  document.getElementById('dayStatus').textContent='저장됨';

  renderCalendar(); renderArchive();

}

function clearDayCanvas(){pen.clearRect(0,0,dayCanvas.width,dayCanvas.height);hasInk=false;}

function clearDay() {

  clearDayCanvas();

  const previous=entries[selectedDate];

  if(previous===undefined){

    document.getElementById('dayStatus').textContent='지웠습니다 · 다시 그릴 수 있습니다';

    return;

  }

  delete entries[selectedDate];

  try {

    localStorage.setItem(notesKey,JSON.stringify(entries));

  } catch(error) {

    entries[selectedDate]=previous;

    document.getElementById('dayStatus').textContent=`삭제 실패: ${error.message}`;

    if(typeof previous==='string'&&previous.startsWith('data:image/')){

      const image=new Image();

      image.onload=()=>{pen.drawImage(image,0,0,dayCanvas.width,dayCanvas.height);hasInk=true;};

      image.src=previous;

    }

    return;

  }

  document.getElementById('dayStatus').textContent='삭제했습니다 · 다시 그릴 수 있습니다';

  renderCalendar();

  renderArchive();

}

function penPoint(event){const rect=dayCanvas.getBoundingClientRect();return{x:(event.clientX-rect.left)*dayCanvas.width/rect.width,y:(event.clientY-rect.top)*dayCanvas.height/rect.height};}

function saveTextPreview(value){return typeof value==='string'&&!value.startsWith('data:image/')?value:'';}

function renderArchive() {

  const list=document.getElementById('archiveList'); list.replaceChildren();

  const dates=Object.keys(entries).sort().reverse();

  if(!dates.length){const empty=document.createElement('div');empty.className='archive-item';empty.textContent='저장된 기록이 없습니다';list.append(empty);return;}

  for(const date of dates){const button=document.createElement('button');button.type='button';button.className='archive-item';

    const value=entries[date];

    if(typeof value==='string'&&value.startsWith('data:image/')){const thumb=document.createElement('img');thumb.className='archive-thumb';thumb.src=value;thumb.alt='';button.append(thumb);}

    button.append(document.createTextNode(`${date}${saveTextPreview(value)?`  ·  ${saveTextPreview(value)}`:'  ·  저장됨'}`));

    button.addEventListener('click',()=>openDay(date));list.append(button);}

}

function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function projectScreen() {

  const corners=[new THREE.Vector3(-1.315,4.655,-.9),new THREE.Vector3(1.315,4.655,-.9),new THREE.Vector3(-1.315,2.925,-.9),new THREE.Vector3(1.315,2.925,-.9)];

  camera.updateMatrixWorld();

  const points=corners.map(v=>v.project(camera));

  const xs=points.map(p=>(p.x*.5+.5)*innerWidth), ys=points.map(p=>(-.5*p.y+.5)*innerHeight);

  const left=Math.min(...xs),top=Math.min(...ys),right=Math.max(...xs),bottom=Math.max(...ys);

  projectedScreenBounds={left,top,right,bottom};

  memo.style.left=`${left}px`; memo.style.top=`${top}px`; memo.style.width=`${right-left}px`; memo.style.height=`${bottom-top}px`;

  memo.style.setProperty('--ui-scale',String(THREE.MathUtils.lerp(.45,1,progress)));

}

addEventListener('pointerdown',event=>{

  if(event.button!==0 || !projectedScreenBounds || event.target.closest('button, input, textarea, select, a, canvas'))return;

  const {left,top,right,bottom}=projectedScreenBounds;

  const width=right-left,height=bottom-top;

  const edgeX=Math.max(12,width*.08),edgeY=Math.max(12,height*.08);

  const x=event.clientX,y=event.clientY;

  const insideComputer=x>=left-edgeX&&x<=right+edgeX&&y>=top-edgeY&&y<=bottom+edgeY;

  const onEdge=x<=left+edgeX||x>=right-edgeX||y<=top+edgeY||y>=bottom-edgeY;

  if(!insideComputer||!onEdge)return;

  targetProgress=targetProgress>.5?0:1;

  event.preventDefault();

},{passive:false});

function animate() {

  requestAnimationFrame(animate);

  progress=THREE.MathUtils.lerp(progress,targetProgress,.045);

  const nextPixelatedView=progress<=.67;

  if(nextPixelatedView!==pixelatedView) {

    pixelatedView=nextPixelatedView;

    sizePixelCanvas(pixelatedView ? .08 : .42);

  }

  const glowTarget=THREE.MathUtils.clamp((progress-.35)/.35,0,1);

  lit=THREE.MathUtils.lerp(lit,glowTarget,.055);

  camera.position.lerpVectors(cameraStart,cameraEnd,progress);

  const target=new THREE.Vector3().lerpVectors(lookStart,lookEnd,progress);

  camera.lookAt(target);

  screenGlow.intensity=lit*2.5; lampBulb.intensity=lit>0.6?4:0;

  led.material.color.set(lit>.18?'#b3ff85':'#827952');

  dust.rotation.y+=.00013;

  paintTerminal(lit,progress);

  projectScreen();

  const farView=progress<=.08;

  if(farView&&!document.body.classList.contains('far-view'))typeScrollHint();

  document.body.classList.toggle('far-view',farView);

  memo.classList.toggle('visible',farView||progress>.67); if(progress>.7)document.getElementById('enterStudio')?.classList.add('hidden');

  renderer.render(scene,camera);

}

function mouseWheel(event) {
  if(event.target.closest && event.target.closest('#rolodexOverlay, textarea, input'))return;
  if(roloOverlay.classList.contains("open"))return;

  if(document.getElementById('rolodexOverlay').classList.contains('open'))return;
  if(!Number.isFinite(event.deltaY)||event.deltaY===0)return;

  const direction=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?innerHeight:1);

  targetProgress=THREE.MathUtils.clamp(targetProgress+direction*.00065,0,1);

  event.preventDefault();

}

// iPad: pinch two fingers to zoom the 3D camera. Keep the original
// one-finger vertical swipe and desktop mouse wheel exactly as before.
let touchY=null;
let pinchDistance=null;
function touchSeparation(touches) {
  return Math.hypot(touches[0].clientX-touches[1].clientX,
                    touches[0].clientY-touches[1].clientY);
}
function isEditorGestureTarget(node) {
  return !!(node && node.closest && node.closest(
    '#rolodexOverlay, #memoLibrary, #dayCanvas, input, textarea, select, button'
  ));
}
// Listen at window level because the canvas can be covered by the CRT desktop.
// Capture early so Safari does not pinch-zoom the *whole page* before our camera updates.
function isSceneGesture(event) { return !isEditorGestureTarget(event.target); }
window.addEventListener('touchstart', event => {
  if (event.touches.length === 2 && isSceneGesture(event)) {
    pinchDistance = touchSeparation(event.touches);
    touchY = null;
    if (event.cancelable) event.preventDefault();
  } else if (event.touches.length !== 2) {
    pinchDistance = null;
  }
}, {passive:false,capture:true});
window.addEventListener('touchmove', event => {
  if (event.touches.length !== 2 || !isSceneGesture(event)) return;
  if (event.cancelable) event.preventDefault();
  const current = touchSeparation(event.touches);
  if (pinchDistance !== null) {
    // Fingers spreading = move closer to CRT. Fingers closing = move away.
    targetProgress = THREE.MathUtils.clamp(targetProgress+(current-pinchDistance)*.0035,0,1);
  }
  pinchDistance=current;
}, {passive:false,capture:true});
// iPad Safari also emits proprietary gesture events: block its page zoom only in scene.
for (const type of ['gesturestart','gesturechange','gestureend']) {
  document.addEventListener(type,event=>{
    if (isSceneGesture(event) && event.cancelable) event.preventDefault();
  },{passive:false,capture:true});
}
window.addEventListener('touchend', event => {
  if (event.touches.length < 2) { pinchDistance = null; touchY = null; }
}, {passive:true});
window.addEventListener('touchcancel', () => { pinchDistance = null; touchY = null; }, {passive:true});

renderer.domElement.addEventListener('touchstart', event => {
  if (event.touches.length === 1) touchY = event.touches[0].clientY;
}, {passive:true});
renderer.domElement.addEventListener('touchmove', event => {
  if (event.touches.length !== 1 || touchY === null || pinchDistance !== null) return;
  const y = event.touches[0].clientY;
  targetProgress = THREE.MathUtils.clamp(targetProgress + (touchY-y)*.004, 0, 1);
  touchY = y;
  event.preventDefault();
}, {passive:false});

function syncSceneViewport() {
  // Camera projection, render backing buffer and HTML CRT overlay must share one viewport.
  camera.aspect = innerWidth / Math.max(1,innerHeight);
  camera.updateProjectionMatrix();
  sizePixelCanvas(progress<=.67 ? .08 : .42);
  pixelatedView=progress<=.67;
  projectScreen();
}
addEventListener('resize',syncSceneViewport);
addEventListener('orientationchange',()=>requestAnimationFrame(syncSceneViewport));
if(window.visualViewport) window.visualViewport.addEventListener('resize',syncSceneViewport);


// Oversized, independently layered text archive (not clipped to the CRT screen).
const roloOverlay=document.getElementById('rolodexOverlay');
const roloTabs=document.getElementById('roloTabs');
const roloTitle=document.getElementById('roloTitle');
const roloText=document.getElementById('roloText');
const roloStatus=document.getElementById('roloStatus');
const roloKey='night-studio-rolodex-v1';
let roloCards=[];let roloIndex=0;
try{const saved=JSON.parse(localStorage.getItem(roloKey)||'[]');if(Array.isArray(saved))roloCards=saved.filter(x=>x&&typeof x==='object');}catch(e){}
if(!roloCards.length)roloCards=[{title:'',text:''}];
function roloPersist(){try{localStorage.setItem(roloKey,JSON.stringify(roloCards));roloStatus.textContent='SAVED / 저장됨';}catch(e){roloStatus.textContent='ERROR / 저장 실패';}}
function roloCommit(){const c=roloCards[roloIndex];if(!c)return;c.title=roloTitle.value;c.text=roloText.value;roloPersist();}
function roloRender(){const c=roloCards[roloIndex];roloTitle.value=c.title||'';roloText.value=c.text||'';document.querySelector('.rolo-head strong').textContent='INDEX / '+String(roloIndex+1).padStart(3,'0');roloTabs.replaceChildren();const start=Math.max(0,Math.min(roloIndex-2,roloCards.length-5));roloCards.slice(start,start+5).forEach((card,j)=>{const idx=start+j;const btn=document.createElement('button');btn.type='button';btn.className='rolo-tab'+(idx===roloIndex?' active':'');btn.style.setProperty('--x',(j%3)*33+'%');btn.style.setProperty('--y',Math.floor(j/3)*50+'px');btn.style.zIndex=idx===roloIndex?'8':String(5-j);btn.textContent=(card.title||'UNTITLED / 제목 없음').slice(0,17);btn.addEventListener('click',()=>roloGo(idx));roloTabs.append(btn);});roloStatus.textContent=(roloIndex+1)+' / '+roloCards.length;}
let roloFlipping=false;
function roloGo(index){
 if(roloFlipping||index===roloIndex)return;
 roloCommit();
 const direction=index>roloIndex?'next':'prev';
 roloIndex=(index+roloCards.length)%roloCards.length;
 roloRender();
 const sheet=document.querySelector('.rolo-sheet');
 sheet.classList.remove('flip-next','flip-prev');
 void sheet.offsetWidth;
 sheet.classList.add('flip-'+direction);
 roloFlipping=true;
 setTimeout(()=>{sheet.classList.remove('flip-next','flip-prev');roloFlipping=false;},540);
}
function roloOpen(){roloOverlay.classList.add('open');roloOverlay.setAttribute('aria-hidden','false');roloRender();}
function roloClose(){roloCommit();roloOverlay.classList.remove('open');roloOverlay.setAttribute('aria-hidden','true');}
document.getElementById('openRolodex').addEventListener('click',roloOpen);
document.getElementById('roloClose').addEventListener('click',roloClose);
document.getElementById('roloPrev').addEventListener('click',()=>roloGo(roloIndex-1));
document.getElementById('roloNext').addEventListener('click',()=>roloGo(roloIndex+1));
document.getElementById('roloSave').addEventListener('click',()=>{roloCommit();roloRender();});
document.getElementById('roloNew').addEventListener('click',()=>{roloCommit();roloCards.push({title:'',text:''});roloIndex=roloCards.length-1;roloPersist();roloRender();roloTitle.focus();roloTitle.select();});
document.getElementById('roloDelete').addEventListener('click',()=>{if(!confirm('DELETE THIS MEMO? / 이 메모를 삭제할까요?'))return;roloCards.splice(roloIndex,1);if(!roloCards.length)roloCards.push({title:'',text:''});roloIndex=Math.min(roloIndex,roloCards.length-1);roloPersist();roloRender();});
roloOverlay.addEventListener('wheel',e=>{e.stopPropagation();if(e.target===roloText)return;e.preventDefault();if(Math.abs(e.deltaY)>5&&!roloFlipping)roloGo(roloIndex+(e.deltaY>0?1:-1));},{passive:false});
roloOverlay.addEventListener('pointerdown',e=>e.stopPropagation());
roloOverlay.addEventListener('click',e=>{if(e.target===roloOverlay)roloClose();});
addEventListener('keydown',e=>{if(!roloOverlay.classList.contains('open'))return;if(e.key==='Escape'){e.stopImmediatePropagation();roloClose();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();roloCommit();}},true);

// p5.js: a restrained, low-resolution arcade scanline effect over the memo window.
if(typeof p5!=="undefined"){
 new p5(p=>{
  let layer;
  p.setup=()=>{layer=p.createCanvas(p.windowWidth,p.windowHeight);layer.parent('pixelFx');p.pixelDensity(1);p.frameRate(12);};

   for(let y=0;y<p.height;y+=8){p.fill(0,0,0,9);p.rect(0,y,p.width,1);}
  };

 });

// Matter.js: physical pixel fragments fall and collide when a memo is deleted.
function memoPixelBurst(){
 if(typeof Matter==='undefined')return;
 const {Engine,Bodies,Body,Composite}=Matter;
 const engine=Engine.create();engine.gravity.y=1.3;
 const W=window.innerWidth,H=window.innerHeight;
 const ground=Bodies.rectangle(W/2,H+20,W*2,40,{isStatic:true});
 Composite.add(engine.world,ground);
 const origin=document.querySelector('.rolo-sheet').getBoundingClientRect();
 const fragments=[];
 for(let i=0;i<26;i++){
  const size=4+(i%3)*3;
  const b=Bodies.rectangle(origin.left+origin.width*(.2+Math.random()*.6),origin.top+origin.height*.3,size,size,{restitution:.45,friction:.25});
  Body.setVelocity(b,{x:(Math.random()-.5)*14,y:-4-Math.random()*7});
  Composite.add(engine.world,b);fragments.push({b,size});
 }
 const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
 canvas.style.cssText='position:fixed;inset:0;z-index:45;pointer-events:none;image-rendering:pixelated';
 document.getElementById('pixelFx').append(canvas);const ctx=canvas.getContext('2d');let frame=0;
 function tick(){Engine.update(engine,1000/60);ctx.clearRect(0,0,W,H);
  for(const f of fragments){ctx.save();ctx.translate(f.b.position.x,f.b.position.y);ctx.rotate(f.b.angle);ctx.fillStyle=frame%5===0?'#9bc9aa':'#f6f6f1';ctx.fillRect(-f.size/2,-f.size/2,f.size,f.size);ctx.restore();}
  if(++frame<110&&roloOverlay.classList.contains('open'))requestAnimationFrame(tick);else{canvas.remove();Composite.clear(engine.world,false);Engine.clear(engine);}
 }requestAnimationFrame(tick);
}
document.getElementById('roloDelete').addEventListener('click',memoPixelBurst);

// Tablet: one-tap camera entrance, swipe cards without interfering with text editing.
let swipeStart=null;
const cardSwipeZone=document.querySelector('.rolo-tabs');
cardSwipeZone.addEventListener('touchstart',e=>{if(e.touches.length===1)swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
cardSwipeZone.addEventListener('touchend',e=>{if(!swipeStart||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-swipeStart.x;const dy=e.changedTouches[0].clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>42&&Math.abs(dx)>Math.abs(dy)&&!roloFlipping)roloGo(roloIndex+(dx<0?1:-1));},{passive:true});
// Saved-card archive, export/import for transferring notes between computer and iPad.

}
